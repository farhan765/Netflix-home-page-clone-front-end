<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="pic">
      <header>
        <div id="logo">
          <img src="images/imgi_2_Netflix_Logo_PMS.png" alt="Netflix logo" />
          <a href="signup.html" class="cta-signup">Sign In</a>
        </div>
      </header>
      <main>
        <div class="hero-content">
          <h1>Unlimited movies, TV shows, and more</h1>
          <p class="hero-tagline">Watch anywhere. Cancel anytime.</p>
          <div class="form">
            <form method="get" action="signup.html">
              <div class="form-group">
                <label for="email" class="form-label">Ready to watch? Enter your email to create or restart your membership.</label>
                <div class="form-inputs">
                  <input id="email" type="email" name="email" placeholder="Email address" required />
                  <button type="submit" class="btn-get-started">Get Started</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
    <footer></footer>
  </body>
</html>
